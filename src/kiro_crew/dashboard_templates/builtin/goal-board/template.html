<div class="board">
  <style>
    .board { font: 12px/1.45 system-ui, sans-serif; color: var(--text, #e6e6e6); padding: 10px; }
    .board h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--text-strong, #fff); }
    .board .goal { font-size: 13px; font-weight: 600; color: var(--text-strong, #fff); }
    .board .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .board .sub { font-size: 10px; color: var(--muted, #9aa); }
    .states { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 9px 0 5px; background: var(--bg-hover, #222); }
    .states i { display: block; height: 100%; }
    .tally { display: flex; flex-wrap: wrap; gap: 9px; font-size: 10.5px; color: var(--muted, #9aa); }
    .tally b { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .item { border: 1px solid var(--border, #333); border-radius: 8px; padding: 8px 9px; margin-top: 6px; }
    .item .t { font-weight: 600; color: var(--text-strong, #fff); }
    .item .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .chip { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--bg-hover, #222); }
    .item .line { font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .item .line em { color: var(--text, #e6e6e6); font-style: normal; }
  </style>

  <h2 data-i18n="title">Goal board</h2>
  <div class="goal" data-dashboard-field="goal">-</div>
  <div class="meta">
    <span><span data-i18n="round">round</span> <span data-dashboard-field="round">-</span></span>
    <span><span data-i18n="goal_version">goal version</span> <span data-dashboard-field="goal_version">-</span></span>
    <span><span data-i18n="depth">depth</span> <span data-dashboard-field="depth">-</span></span>
    <span><span data-i18n="entries">entries</span> <span data-dashboard-field="entries">-</span></span>
  </div>
  <div class="meta">
    <span><span data-i18n="opened">opened</span> <span data-dashboard-field="created_at">-</span></span>
    <span><span data-i18n="last_write">last write</span> <span data-dashboard-field="last_entry_at">-</span></span>
  </div>

  <div class="states" id="states"></div>
  <div class="tally" id="tally"></div>

  <div id="items"></div>

  <div class="sub" style="margin-top: 7px;">
    <span data-dashboard-field="items">-</span> <span data-i18n="on_board">on the board,</span>
    <span data-dashboard-field="omitted">-</span> <span data-i18n="not_shown">not shown (list truncated)</span>
  </div>

  <script>
    (function () {
      var DASH = '\u2014';

      // The page's own words, one table per UI language. A key a language lacks
      // falls back to English. Values the ledger or a crewmate wrote are never
      // looked up here. The zh-CN strings are \u-escaped so the source stays ASCII.
      var I18N = {
        en: {
          title: 'Goal board', round: 'round', goal_version: 'goal version', depth: 'depth',
          entries: 'entries', opened: 'opened', last_write: 'last write',
          on_board: 'on the board,', not_shown: 'not shown (list truncated)',
          verdict: 'verdict {v}', fails: '{n} fail(s)', worker_status: 'worker {v}', pr: 'PR {n}',
          decision: 'decision', reported: 'reported', worker: 'worker',
          empty: 'No item on this board yet.',
          state_open: 'open', state_accepted: 'accepted', state_rejected: 'rejected',
          state_blocked: 'blocked', state_abandoned: 'abandoned', state_unknown: 'unknown'
        },
        'zh-CN': {
          title: '\u76ee\u6807\u770b\u677f', round: '\u8f6e\u6b21', goal_version: '\u76ee\u6807\u7248\u672c', depth: '\u5c42\u7ea7',
          entries: '\u6761\u76ee', opened: '\u5f00\u542f\u4e8e', last_write: '\u6700\u540e\u5199\u5165',
          on_board: '\u9879\u5728\u770b\u677f\u4e0a\uff0c', not_shown: '\u9879\u672a\u663e\u793a\uff08\u5217\u8868\u5df2\u622a\u65ad\uff09',
          verdict: '\u88c1\u5b9a {v}', fails: '{n} \u6b21\u5931\u8d25', worker_status: '\u6267\u884c\u8005 {v}', pr: 'PR {n}',
          decision: '\u51b3\u5b9a', reported: '\u6c47\u62a5', worker: '\u6267\u884c\u8005',
          empty: '\u770b\u677f\u4e0a\u8fd8\u6ca1\u6709\u4efb\u4f55\u4e8b\u9879\u3002',
          state_open: '\u8fdb\u884c\u4e2d', state_accepted: '\u5df2\u63a5\u53d7', state_rejected: '\u5df2\u62d2\u7edd',
          state_blocked: '\u53d7\u963b', state_abandoned: '\u5df2\u653e\u5f03', state_unknown: '\u672a\u77e5'
        }
      };
      function locale() {
        var l = (window.kirocrew || {}).locale;
        return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
      }
      function has(key) {
        return Object.prototype.hasOwnProperty.call(I18N.en, key);
      }
      function i18n(key, vars) {
        var table = I18N[locale()];
        var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];
        if (s === undefined) s = key;
        if (vars) {
          s = s.replace(/\{(\w+)\}/g, function (m, k) {
            return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
          });
        }
        return s;
      }
      // A state the ledger stamps is shown in the reader's language when this page
      // knows it, and as recorded when it does not.
      function stateLabel(state) {
        return has('state_' + state) ? i18n('state_' + state) : state;
      }
      function applyStatic() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
      }

      // The states the work ledger stamps. Colour per state, named here rather than
      // derived, because a state this page has no colour for must still be VISIBLE:
      // it falls through to the neutral chip instead of vanishing from the tally.
      var STATES = [
        ['open', 'open', 'var(--accent, #00d492)'],
        ['accepted', 'accepted', 'var(--info, #6aa9ff)'],
        ['rejected', 'rejected', 'var(--danger, #ff5c5c)'],
        ['blocked', 'blocked', 'var(--warn, #ffd230)'],
        ['abandoned', 'abandoned', 'var(--muted, #9aa)']
      ];

      function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
      function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
      function colourFor(state) {
        for (var i = 0; i < STATES.length; i++) if (STATES[i][0] === state) return STATES[i][2];
        return 'var(--muted-strong, #778)';
      }
      function chip(label, colour) {
        var el = document.createElement('span');
        el.className = 'chip';
        el.textContent = label;
        if (colour) el.style.color = colour;
        return el;
      }
      function line(label, value) {
        var el = document.createElement('div');
        el.className = 'line';
        el.appendChild(document.createTextNode(label + ' '));
        var em = document.createElement('em');
        em.textContent = value;
        el.appendChild(em);
        return el;
      }

      function items() {
        var f = (window.kirocrew || {}).fields || {};
        return Array.isArray(f.items) ? f.items.filter(function (i) { return i && typeof i === 'object'; }) : [];
      }

      function drawStates(list) {
        var bar = document.getElementById('states');
        var tally = document.getElementById('tally');
        if (!bar || !tally) return;
        bar.textContent = '';
        tally.textContent = '';
        var counts = {};
        var order = [];
        for (var i = 0; i < list.length; i++) {
          var s = text(list[i].state) || 'unknown';
          if (counts[s] === undefined) { counts[s] = 0; order.push(s); }
          counts[s] += 1;
        }
        // Known states first in their declared order, then anything the ledger used
        // that this page does not know, so a new state shows up rather than hiding.
        var seq = [];
        for (var k = 0; k < STATES.length; k++) if (counts[STATES[k][0]]) seq.push(STATES[k][0]);
        for (var o = 0; o < order.length; o++) if (seq.indexOf(order[o]) === -1) seq.push(order[o]);
        for (var j = 0; j < seq.length; j++) {
          var state = seq[j];
          var seg = document.createElement('i');
          seg.style.background = colourFor(state);
          seg.style.width = (list.length ? (counts[state] / list.length) * 100 : 0) + '%';
          bar.appendChild(seg);
          var row = document.createElement('span');
          var sw = document.createElement('b');
          sw.style.background = colourFor(state);
          row.appendChild(sw);
          row.appendChild(document.createTextNode(' ' + stateLabel(state) + ' ' + counts[state]));
          tally.appendChild(row);
        }
      }

      function drawItems(list) {
        var host = document.getElementById('items');
        if (!host) return;
        host.textContent = '';
        for (var i = 0; i < list.length; i++) {
          var it = list[i];
          var card = document.createElement('div');
          card.className = 'item';
          var t = document.createElement('div');
          t.className = 't';
          t.textContent = text(it.title) || text(it.item_id) || DASH;
          card.appendChild(t);

          var chips = document.createElement('div');
          chips.className = 'chips';
          var state = text(it.state) || 'unknown';
          chips.appendChild(chip(stateLabel(state), colourFor(state)));
          // A VERDICT and a STATE are different facts and the board keeps both: the
          // verdict is what the acceptance evaluator answered, the state is what the
          // conductor then stamped. Showing only one hides a disagreement.
          var verdict = text(it.verdict);
          if (verdict) chips.appendChild(chip(i18n('verdict', { v: verdict }), null));
          var fails = num(it.fails);
          if (fails) chips.appendChild(chip(i18n('fails', { n: fails }), 'var(--danger, #ff5c5c)'));
          var status = text(it.status);
          // The worker's own last word, which is a CLAIM rather than an acceptance.
          if (status) chips.appendChild(chip(i18n('worker_status', { v: status }), null));
          var pr = num(it.pr);
          if (pr) chips.appendChild(chip(i18n('pr', { n: pr }), 'var(--info, #6aa9ff)'));
          card.appendChild(chips);

          var decision = text(it.decision);
          if (decision) card.appendChild(line(i18n('decision'), decision));
          var summary = text(it.summary);
          if (summary) card.appendChild(line(i18n('reported'), summary));
          var worker = text(it.spender);
          if (worker) card.appendChild(line(i18n('worker'), worker));
          host.appendChild(card);
        }
        if (!list.length) {
          var empty = document.createElement('div');
          empty.className = 'line';
          empty.textContent = i18n('empty');
          host.appendChild(empty);
        }
      }

      function render() {
        var list = items();
        applyStatic();
        // A conductor that opened no board leaves `conductor.goal` and the stamps as
        // the empty string. The host binds that as blank, which reads as a page that
        // failed to load, so it becomes a dash.
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        }
        drawStates(list);
        drawItems(list);
        // The bound element for the array gets a count: the host binds by textContent,
        // so left alone this cell reads as dumped JSON.
        var note = document.querySelector('[data-dashboard-field="items"]');
        if (note) note.textContent = String(list.length);
      }

      render();
      window.addEventListener('load', render);
      window.addEventListener('message', function () { setTimeout(render, 0); });
    }());
  </script>
</div>
