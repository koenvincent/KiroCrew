name: canary-black-pr12821
# Throwaway helper on the fork's canary branch: format the files the PR's
# black gate flagged with the repo's pinned black and return the patch.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-black-pr12821.yml]
env:
  PR_HEAD: 849658ff44fcc939a511bb7a22d7888c85cbe82d
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.3.1
      - run: |
          black --target-version py310 \
            src/kiro_crew/instances/ssh_tunnel_manager.py \
            src/kiro_crew/instances/transports/__init__.py \
            src/kiro_crew/instances/transports/base.py \
            src/kiro_crew/instances/transports/fargate.py \
            src/kiro_crew/instances/transports/params.py \
            src/kiro_crew/instances/transports/ssh.py \
            src/kiro_crew/instances/transports/ssm.py \
            test/test_cloud_fargate_single_forward_path.py \
            test/test_instances.py \
            test/test_instances_transports.py
          git diff > black.patch
          wc -l black.patch
      - uses: actions/upload-artifact@v4
        with:
          name: black-patch
          path: black.patch
