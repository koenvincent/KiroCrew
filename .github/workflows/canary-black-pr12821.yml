name: canary-black-pr12821
# Throwaway helper on the fork's canary branch: format the files the PR's
# black gate flagged with the repo's pinned black and return the patch.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-black-pr12821.yml]
env:
  PR_HEAD: a1dc1795a317e81860603ed29e8b1dc69d627db4
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.3.1
      - run: |
          black --target-version py310 \
            src/kiro_crew/dashboard/remote_subagents.py \
            src/kiro_crew/dashboard/remote_workspaces.py \
            src/kiro_crew/mcp_tools/spawn.py \
            src/kiro_crew/security_posture.py \
            test/test_remote_subagent_executor.py
          git diff > black.patch
          wc -l black.patch
      - uses: actions/upload-artifact@v4
        with:
          name: black-patch
          path: black.patch
