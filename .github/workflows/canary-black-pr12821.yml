name: canary-black-pr12821
# Throwaway helper on the fork's canary branch: format the files the PR's
# black gate flagged with the repo's pinned black and return the patch.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-black-pr12821.yml]
env:
  PR_HEAD: 1b519f9a4fadf98830d255e8063a3d747742c6ab
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.3.1 isort==6.0.0
      - run: |
          FILES="src/kiro_crew/config/integration_sections.py src/kiro_crew/config/section_builders.py src/kiro_crew/dashboard/handlers/messaging.py src/kiro_crew/dashboard/messaging_api/run_control.py src/kiro_crew/dashboard/messaging_api/run_views.py src/kiro_crew/dashboard/messaging_api/spawn.py src/kiro_crew/dashboard/remote_subagents.py src/kiro_crew/dashboard/remote_workspaces.py src/kiro_crew/dashboard/server.py src/kiro_crew/dashboard/server_runtime/mcp_routes.py src/kiro_crew/dashboard/state.py src/kiro_crew/mcp_tools/spawn.py src/kiro_crew/platform/governance.py src/kiro_crew/sandbox.py src/kiro_crew/security/paths.py src/kiro_crew/security_posture.py src/kiro_crew/slack/gateway.py src/kiro_crew/subagent.py src/kiro_crew/subagent_manager/admission/gate.py src/kiro_crew/subagent_manager/cancellation.py src/kiro_crew/subagent_manager/run.py src/kiro_crew/subagent_manager/waves.py src/kiro_crew/validation.py test/test_admission_gate.py test/test_cron_approval_mode.py test/test_cron_thread_routing.py test/test_dashboard_server_composition_contract.py test/test_governance_chokepoints.py test/test_handlers_messaging_coverage.py test/test_instances.py test/test_remote_subagent_executor.py test/test_sandbox_absent_ceiling_seal.py test/test_security_posture.py test/test_slack_gateway.py test/test_slack_gateway_more_coverage.py test/test_spawn_audit.py test/test_subagent_panel_durable_replay.py"
          isort $FILES
          black --target-version py310 $FILES
          git diff > black.patch
          wc -l black.patch
          cat black.patch
      - uses: actions/upload-artifact@v4
        with:
          name: black-patch
          path: black.patch
