name: canary-black-pr12821
# Throwaway helper on the fork's canary branch: format the files the PR's
# black gate flagged with the repo's pinned black and return the patch.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-black-pr12821.yml]
env:
  PR_HEAD: 9abe70d3349b7cf24e499b95b6d0d0dc0efab5f5
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.3.1 isort==6.0.0
      - run: |
          FILES="src/kiro_crew/dashboard/remote_subagents.py src/kiro_crew/platform/governance.py src/kiro_crew/subagent.py test/test_governance_chokepoints.py test/test_remote_subagent_executor.py"
          isort $FILES
          black --target-version py310 $FILES
          git diff > black.patch
          wc -l black.patch
          cat black.patch
      - uses: actions/upload-artifact@v4
        with:
          name: black-patch
          path: black.patch
