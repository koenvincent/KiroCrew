name: canary-black-pr12821
# Throwaway helper on the fork's canary branch: format the files the PR's
# black gate flagged with the repo's pinned black and return the patch.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-black-pr12821.yml]
env:
  PR_HEAD: 4f4c99bcb17dc3d2b3756d4f5a972b65d1e748a8
permissions:
  contents: read
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.3.1
      - run: |
          black --target-version py310 \
            src/kiro_crew/dashboard/messaging_api/run_control.py \
            src/kiro_crew/dashboard/messaging_api/spawn.py \
            src/kiro_crew/dashboard/remote_subagents.py \
            test/test_handlers_messaging_coverage.py \
            test/test_instances.py
          git diff > black.patch
          wc -l black.patch
      - uses: actions/upload-artifact@v4
        with:
          name: black-patch
          path: black.patch
