name: canary-ux-13337
# Throwaway helper on the fork's canary branch: typecheck and test the UX fix
# for the PeerTransport seam PR, then shoot its screenshots. Returns artifacts.
# Round 2: Connect disabled on an unmapped row, hint shown inline.
on:
  push:
    branches: [canary/pr12821-remote-executor]
    paths: [.github/workflows/canary-ux-13337.yml]
permissions:
  contents: read
jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koenvincent/KiroCrew
          ref: scratch/ux-13337
      - run: git log -1 --format=%H
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx eslint src/pages/settings/RemoteCrewPanel.tsx src/pages/settings/transportCopy.ts src/test/RemoteCrewPanel.test.tsx
      - run: npx vitest run src/test/RemoteCrewPanel.test.tsx src/test/remoteCrewTransportPresentation.test.ts
      - run: npx playwright install chromium
      - run: node capture/shoot-remote-crew-unmapped-transport.mjs "$GITHUB_WORKSPACE/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-shots
          path: shots/
