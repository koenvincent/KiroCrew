name: Canary PR12821 (remote subagent executor)

on:
  workflow_dispatch: {}
  push:
    branches: [canary/pr12821-remote-executor]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: sshd prerequisite check
        run: |
          which sshd
          which ssh-keygen

      - name: Run canary scenarios
        id: canary
        env:
          CANARY_EVIDENCE_PATH: ${{ github.workspace }}/canary-evidence.json
        run: |
          set -o pipefail
          python scripts/canary/remote_executor_canary.py 2>&1 | tee canary-run.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-evidence
          path: |
            canary-evidence.json
            canary-run.log
          if-no-files-found: warn
          retention-days: 14
